name: Deployment
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Install Nodejs
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci

  deploy:
    needs: [test] # Array for multiple jobs
    runs-on: ubuntu-latest
    steps:
      - name: "Get code"
        uses: actions/checkout@v7
      - name: "Install NodeJs"
        uses: actions/setup-node@v7
        with:
          node-vesion: 24
      - name: "Install dependencies"
        run: npm ci
      - name: "Build project"
        run: npm run build
      - name: "Deploy"
        run: echo "Deploy"
